services:
  backend:
    build:
      context: ./backend_py
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    deploy:
      resources:
        limits:
          memory: 900M
        reservations:
          memory: 512M
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-4000}
      DATA_PATH: /data
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      MAX_PAGES: ${MAX_PAGES:-50}
      MAX_DEPTH: ${MAX_DEPTH:-3}
      PAGE_TIMEOUT_MS: ${PAGE_TIMEOUT_MS:-30000}
      TABLE_MIN_CONFIDENCE: ${TABLE_MIN_CONFIDENCE:-0.5}
      MIN_IMAGE_WIDTH: ${MIN_IMAGE_WIDTH:-120}
      MIN_IMAGE_HEIGHT: ${MIN_IMAGE_HEIGHT:-80}
      MIN_IMAGE_AREA: ${MIN_IMAGE_AREA:-9600}
      ANALYSIS_CONCURRENCY: ${ANALYSIS_CONCURRENCY:-1}
      IMAGE_HTTP_RETRIES: ${IMAGE_HTTP_RETRIES:-2}
      STRUCTURE_MIN_ROWS: ${STRUCTURE_MIN_ROWS:-2}
      STRUCTURE_MIN_COLS: ${STRUCTURE_MIN_COLS:-2}
      CRAWLER_CONCURRENCY: ${CRAWLER_CONCURRENCY:-2}
      BROWSER_CONCURRENCY: ${BROWSER_CONCURRENCY:-2}
      JOB_TIMEOUT_S: ${JOB_TIMEOUT_S:-600}
      # Fila
      MAX_QUEUE_SIZE: ${MAX_QUEUE_SIZE:-10}
      MAX_CONCURRENT_TASKS: ${MAX_CONCURRENT_TASKS:-1}
      CLEANUP_RESULTS_AFTER_S: ${CLEANUP_RESULTS_AFTER_S:-300}
      MAX_RESULTS_IN_MEMORY: ${MAX_RESULTS_IN_MEMORY:-500}
      RESULTS_FLUSH_INTERVAL: ${RESULTS_FLUSH_INTERVAL:-100}
      # Modelos IA
      PRELOAD_MODELS: ${PRELOAD_MODELS:-false}
      UNLOAD_MODELS_AFTER_S: ${UNLOAD_MODELS_AFTER_S:-0}
      # Browser
      BROWSER_SINGLE_PROCESS: ${BROWSER_SINGLE_PROCESS:-true}
      BROWSER_MAX_TABS: ${BROWSER_MAX_TABS:-2}
      BROWSER_IDLE_TIMEOUT_S: ${BROWSER_IDLE_TIMEOUT_S:-30}
      BROWSER_ARGS_EXTRA: ${BROWSER_ARGS_EXTRA:-}
    volumes:
      - app_data:/data

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
    depends_on:
      - backend

volumes:
  app_data:
