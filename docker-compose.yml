services:
  backend:
    build:
      context: ./backend_py
    restart: unless-stopped
    ports:
      # Exposição local da porta do backend
      - "4000:4000"
    deploy:
      resources:
        limits:
          memory: 900M
        reservations:
          memory: 512M
    environment:
      # ── Servidor e Sistema ──────────────────────────────────────────────────
      BACKEND_PORT: 4000
      DATA_PATH: /data
      ALLOWED_ORIGINS: "*"

      # ── Valores por Omissão de Rastreio (Usados caso o pedido não envie opções) ──
      # No modo single-URL, o limite de páginas e profundidade pode ser especificado no JSON.
      # No modo multi-URL, o limite de páginas é gerido automaticamente por categoria.
      MAX_PAGES: 50
      MAX_DEPTH: 3
      PAGE_TIMEOUT_MS: 30000
      CRAWLER_CONCURRENCY: 4
      BROWSER_CONCURRENCY: 3
      JOB_TIMEOUT_S: 1200

      # ── Filtros na Fonte e Limiares de IA ───────────────────────────────────
      MIN_IMAGE_WIDTH: 120
      MIN_IMAGE_HEIGHT: 80
      MIN_IMAGE_AREA: 9600
      TABLE_MIN_CONFIDENCE: 0.5
      ANALYSIS_CONCURRENCY: 2
      IMAGE_HTTP_RETRIES: 2
      STRUCTURE_MIN_ROWS: 2
      STRUCTURE_MIN_COLS: 2

      # ── Fila Global e Gestão Ativa de Memória (1GB RAM) ─────────────────────
      MAX_QUEUE_SIZE: 0
      MAX_CONCURRENT_TASKS: 1
      CLEANUP_RESULTS_AFTER_S: 300
      MAX_RESULTS_IN_MEMORY: 500
      RESULTS_FLUSH_INTERVAL: 100

      # ── Modelos de IA ───────────────────────────────────────────────────────
      PRELOAD_MODELS: false
      UNLOAD_MODELS_AFTER_S: 0

      # ── Otimizações do Motor de Browser (Chromium) ──────────────────────────
      BROWSER_SINGLE_PROCESS: false
      BROWSER_MAX_TABS: 2
      BROWSER_IDLE_TIMEOUT_S: 30
      BROWSER_ARGS_EXTRA: ""
    volumes:
      - app_data:/data

  frontend:
    build:
      context: ./frontend
      args:
        # URL da API do backend — vista pelo browser do utilizador final
        NEXT_PUBLIC_API_URL: http://localhost:4000
    restart: unless-stopped
    ports:
      # Exposição da porta do frontend (acessível no browser via http://localhost:3001)
      - "3001:3000"
    environment:
      NODE_ENV: production
    depends_on:
      - backend

volumes:
  app_data:
