services:
  backend:
    build: ./backend_py
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - BACKEND_PORT=4000
      - DATA_PATH=/data
      - MAX_PAGES=50
      - MAX_DEPTH=3
      - PAGE_TIMEOUT_MS=30000
      - TABLE_MIN_CONFIDENCE=0.5
    volumes:
      - app_data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://backend:4000
      - NEXT_PUBLIC_API_BASE=/api/jobs
    depends_on:
      - backend

volumes:
  app_data:
