# Override para GPU NVIDIA (CUDA)
# Utilização: docker compose -f docker-compose.yml -f docker-compose.cuda.yml up -d

services:
  backend:
    build:
      context: ./backend_py
      dockerfile: Dockerfile.cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
